services:
  drivly:
    build: .
    image: drivly:local
    container_name: drivly
    restart: unless-stopped
    ports:
      - "${DRIVLY_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: drivly-api:local
    container_name: drivly-api
    restart: unless-stopped
    environment:
      DRIVLY_TOKEN: ${DRIVLY_TOKEN:?Ajoute DRIVLY_TOKEN dans .env (openssl rand -hex 32)}
      DRIVLY_MAX_SNAPSHOTS: ${DRIVLY_MAX_SNAPSHOTS:-50}
    volumes:
      - drivly-data:/data
    expose:
      - "3000"

volumes:
  drivly-data:
