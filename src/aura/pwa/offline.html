<!doctype html>
<html lang="fr" data-theme="light" data-accent="teal">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Hors ligne</title>
    <style>
      :root {
        --bg: #f5f7f8;
        --ink: #10161f;
        --muted: #5b6672;
        --accent: #00aeef;
        --line: #dde3e8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f141c;
          --ink: #f2f6f9;
          --muted: #9aa7b4;
          --line: #263140;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(80% 50% at 50% 0%, color-mix(in oklab, var(--accent) 16%, transparent), transparent 70%),
          var(--bg);
        color: var(--ink);
        font-family: "Inter Tight", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        width: min(100%, 380px);
        padding: 28px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: color-mix(in oklab, var(--bg) 82%, white);
        box-shadow: 0 24px 60px -28px rgb(0 0 0 / 0.35);
      }
      .mark {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        display: grid;
        place-items: center;
        border-radius: 18px;
        background: var(--accent);
        color: #04121a;
        font-weight: 800;
        font-size: 22px;
      }
      h1 { margin: 0 0 8px; font-size: 24px; letter-spacing: -0.03em; }
      p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.55; }
      button {
        margin-top: 20px;
        min-height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: #04121a;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="mark">A</div>
      <h1>Vous êtes hors ligne</h1>
      <p>Les données déjà chargées restent disponibles. Reconnectez-vous pour synchroniser le reste.</p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
