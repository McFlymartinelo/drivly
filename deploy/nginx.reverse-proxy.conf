# À placer dans /etc/nginx/sites-available/ si nginx écoute déjà le port 80
# et que Drivly tourne en Docker sur 127.0.0.1:8080 (DRIVLY_PORT=8080).
#
#   sudo ln -s /etc/nginx/sites-available/drivly /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d drivly.exemple.fr

server {
    listen 80;
    listen [::]:80;
    server_name drivly.exemple.fr;

    location /health {
        proxy_pass http://127.0.0.1:8080/health;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
